<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — PAMP</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 15% 15%, rgba(109,40,217,0.3) 0%, transparent 55%),
        radial-gradient(ellipse at 85% 85%, rgba(139,92,246,0.2) 0%, transparent 50%),
        linear-gradient(160deg, #080c1a 0%, #090e20 100%);
      color: #cdd6f0;
    }
    .wrap { width: 100%; max-width: 400px; }
    .logo { text-align: center; margin-bottom: 28px; }
    .logo-mark {
      width: 54px; height: 54px; border-radius: 15px;
      background: linear-gradient(145deg, #9154fb, #5b21b6);
      box-shadow: 0 8px 32px #7c3aed55;
      display: grid; place-items: center;
      font-size: 26px; margin: 0 auto 14px;
    }
    .logo h1 { font-size: 26px; font-weight: 800; letter-spacing: -1px; color: #e2e8f0; }
    .logo p { color: #6b7fa8; font-size: 13px; margin-top: 5px; }
    .card {
      background: #0d1530;
      border: 1px solid #1e3060;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.5);
    }
    .error-msg {
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 10px;
      color: #fca5a5; font-size: 13px;
      padding: 11px 14px; margin-bottom: 20px;
    }
    .field { margin-bottom: 18px; }
    label { font-size: 11px; color: #6b7fa8; text-transform: uppercase; letter-spacing: .6px; display: block; margin-bottom: 7px; font-weight: 600; }
    input[type=text], input[type=password] {
      width: 100%; height: 44px;
      background: #0a1020; border: 1px solid #1e3060;
      border-radius: 10px; color: #cdd6f0;
      padding: 0 14px; font-size: 14px; font-family: inherit;
      outline: none; transition: border-color .2s, box-shadow .2s;
    }
    input:focus { border-color: #7c3aed; box-shadow: 0 0 0 3px rgba(124,58,237,0.2); }
    input::placeholder { color: #3d4f72; }
    .btn {
      width: 100%; height: 46px; border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #6c2ddb, #8c38ee);
      color: #fff; font-size: 15px; font-weight: 700;
      cursor: pointer; font-family: inherit;
      box-shadow: 0 6px 22px rgba(124,58,237,0.45);
      transition: filter .15s;
      margin-top: 4px;
    }
    .btn:hover { filter: brightness(1.1); }
    .btn:active { filter: brightness(.95); }
    .footer { text-align: center; color: #6b7fa8; font-size: 12px; margin-top: 20px; }
    .footer a { color: #9154fb; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
<div class="wrap">

  <div class="logo">
    <div class="logo-mark">⬡</div>
    <h1>PAMP</h1>
    <p>Pasargad Admins Management Panel</p>
  </div>

  <div class="card">
    {% if form.errors %}
    <div class="error-msg">✕ Invalid username or password. Please try again.</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="field">
        <label for="id_username">Username</label>
        <input type="text" name="username" id="id_username"
               autofocus autocomplete="username" placeholder="Username">
      </div>
      <div class="field">
        <label for="id_password">Password</label>
        <input type="password" name="password" id="id_password"
               autocomplete="current-password" placeholder="Password">
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn">Sign In →</button>
    </form>
  </div>

  <p class="footer">
    PAMP{% if pamp_version %} v{{ pamp_version }}{% endif %} &nbsp;·&nbsp;
    <a href="https://github.com/santiyagoburcart/PAMP" target="_blank" rel="noopener">GitHub</a>
  </p>

</div>
</body>
</html>
